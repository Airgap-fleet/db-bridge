[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "db-bridge"
version = "1.0.0"
description = "Bridge your AI assistant to PostgreSQL databases — query, execute, migrate, and analyze without cloud dependencies"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "AFaaS Team", email = "team@afaas.co.uk"}
]
keywords = ["bridge", "postgresql", "database", "fastmcp"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "fastmcp>=3.4",
    "asyncpg>=0.29",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "structlog>=25.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "uv>=0.5",
]

[project.scripts]
db-bridge = "postgresql_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/postgresql_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "W", "C4", "PT", "PTH", "SIM", "T10", "ARG", "RUF"]
ignore = ["S101", "PTH123", "ARG001", "ARG002"]
fixable = ["F", "I", "UP", "W", "C4", "PT", "PTH", "SIM", "ARG", "RUF"]
unfixable = ["E", "T10", "S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --cov=postgresql_mcp --cov-fail-under=75 -m \"not integration\""
markers = [
    "integration: marks tests as integration tests requiring a PostgreSQL instance",
]