# =============================================================================
# Filesystem MCP Server — CI/CD Pipeline
# Build, test, lint, and publish to PyPI on release tags
# =============================================================================

name: filesystem-mcp

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  validate-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
     
      - name: Install uv
        run: pip install uv
     
      - name: Sync dependencies (dev)
        run: |
          uv sync --dev
       
      - name: Run linter (ruff)
        run: |
          uv run ruff check .
     
      - name: Format check (ruff format)
        run: |
          uv run ruff format --check .
     
      - name: Type check (mypy strict)
        run: |
          uv run mypy --strict .
     
      - name: Run pytest with coverage
        run: |
          uv run pytest -v --cov=filesystem_mcp --cov-fail-under=70 -m "not integration"

  publish:
    needs: validate-and-test
    runs-on: windows-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install uv and build
        run: |
          pip install uv
          cd /c/the%20force/03_Context/projects/afafs/filesystem-mcp
          uv build
      
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.10.3
        with:
          user-otp: ${{ secrets.PYPI_API_TOKEN }}

  docker-build:
    needs: validate-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build filesystem-mcp image
        run: |
          docker build -t filesystem-mcp:latest .
      
      - name: Run health check
        run: |
          echo "Health check would run here in full pipeline"
