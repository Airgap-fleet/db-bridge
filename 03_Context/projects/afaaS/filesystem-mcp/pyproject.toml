[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "filesystem-mcp"
version = "0.1.0"
description = "Local Filesystem MCP Server — safe file operations with configurable sandbox"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "AFaaS Team", email = "engineering@afaaS.io"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Filesystems",
]
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.0.0",
    "structlog>=24.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[project.scripts]
filesystem-mcp = "filesystem_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/filesystem_mcp"]

[tool.hatch.envs.default]
extras = ["dev"]

[tool.hatch.envs.test]
extras = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py311"
preview = true
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "C4", "T20", "PTH"
]
ignore = []
per-file-ignores = { "tests/*" = ["S101", "T201"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "tests.*"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-v",
    "--tb=short",
]

[tool.coverage.run]
source = ["src/filesystem_mcp"]
branch = true

[tool.coverage.report]
fail_under = 87
show_missing = true
precision = 2