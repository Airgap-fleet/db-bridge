[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dashboard-mcp"
version = "0.1.0"
description = "AFaaS Dashboard MCP Server - Fleet API + AgentComms + Group Chat layer for autonomous agent orchestration"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "AFaaS Team", email = "team@afaaS.io"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "fastmcp>=3.4",
    "pydantic>=2.6",
    "pydantic-settings>=2.0",
    "structlog>=24.0",
    "python-dotenv>=1.0",
    "websockets>=12.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "asyncio-mqtt>=0.12",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "mypy>=1.8",
    "ruff>=0.3",
    "pre-commit>=3.6",
    "httpx>=0.27",
]

[project.scripts]
dashboard-mcp = "dashboard_mcp.server:main"

[tool.hatch.version]
source = "code"
path = "src/dashboard_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dashboard_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=dashboard_mcp --cov-report=term-missing --cov-fail-under=90"

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true
python_version = "3.11"

[[tool.mypy.overrides]]
module = "fastmcp.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "websockets.*"
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "PT",
    "TID",
    "SIM",
    "ARG",
]
ignore = [
    "E501",
    "B008",
    "ARG001",
    "ARG002",
]
per-file-ignores = {
    "tests/*": ["S101", "S106", "ARG001", "ARG002"],
    "src/dashboard_mcp/core.py": ["B008"],
}

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.coverage.run]
source = ["src/dashboard_mcp"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude-lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.pre-commit-hooks]
# Handled via .pre-commit-config.yaml
