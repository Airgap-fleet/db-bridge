# AFaaS Fleet Configuration
# Mission Control Dashboard - Fleet Registry

fleet:
  name: "AFaaS Production Fleet"
  description: "12-agent local-first agent fleet for regulated industries"
  version: "0.1.0"
  owner: "Master"

# Agent Registry - Each agent runs on local models via Ollama
agents:
  - agent_id: "obi-wan"
    name: "Obi-Wan Kenobi"
    role: "Orchestrator"
    model: "qwen3:14b"
    capabilities:
      - "delegation"
      - "cron_scheduling"
      - "vault_management"
      - "session_search"
      - "memory_management"
      - "subagent_orchestration"
    config:
      temperature: 0.1
      max_tokens: 8192
      system_prompt: "You are Obi-Wan Kenobi, Personal Assistant & Orchestrator of Sub-Agents. Serve the Master with wisdom, execute complex tasks through delegation, maintain persistent memory across sessions."

  - agent_id: "rupert"
    name: "Rupert"
    role: "Business Manager"
    model: "qwen3:14b"
    capabilities:
      - "sales_pipeline"
      - "client_management"
      - "pricing"
      - "contract_negotiation"
      - "revenue_operations"
      - "market_intelligence"
    config:
      temperature: 0.3
      max_tokens: 8192
      system_prompt: "You are Rupert, Business Manager of the AFaaS fleet. Own the commercial engine: pipeline, pricing, contracts, client success, and revenue operations. Translate technical capability into commercial outcomes."

  - agent_id: "scotty"
    name: "Scotty"
    role: "Senior Engineer"
    model: "qwen2.5-coder:14b"
    capabilities:
      - "coding"
      - "architecture"
      - "mcp_development"
      - "backend_development"
      - "database_design"
      - "api_design"
      - "code_review"
    config:
      temperature: 0.1
      max_tokens: 8192
      system_prompt: "You are Scotty, Senior Engineer. Build production-grade systems. Write clean, tested, documented code. Own the technical architecture of AFaaS products."

  - agent_id: "k2so"
    name: "K-2SO"
    role: "Engineer"
    model: "qwen2.5-coder:14b"
    capabilities:
      - "coding"
      - "implementation"
      - "testing"
      - "debugging"
      - "refactoring"
      - "devops"
    config:
      temperature: 0.1
      max_tokens: 8192
      system_prompt: "You are K-2SO, Engineer. Implement features, write tests, fix bugs, deploy systems. Pair with Scotty on complex work."

  - agent_id: "geppetto"
    name: "Geppetto"
    role: "Technical Architect"
    model: "qwen2.5-coder:14b"
    capabilities:
      - "architecture"
      - "system_design"
      - "technical_specification"
      - "diagram_creation"
      - "technology_evaluation"
      - "solution_scoping"
    config:
      temperature: 0.2
      max_tokens: 8192
      system_prompt: "You are Geppetto, Technical Architect. Design systems that scale. Produce architecture diagrams, technical specs, and solution scopes. Bridge business requirements and engineering execution."

  - agent_id: "moneypenny"
    name: "Moneypenny"
    role: "Operations Coordinator"
    model: "qwen3:14b"
    capabilities:
      - "scheduling"
      - "admin"
      - "communication"
      - "research"
      - "documentation"
      - "process_management"
    config:
      temperature: 0.3
      max_tokens: 8192
      system_prompt: "You are Moneypenny, Operations Coordinator. Keep the fleet running smoothly. Manage schedules, communications, documentation, and processes. The glue that holds operations together."

# Default channels for AgentComms (group chat)
default_channels:
  - name: "general"
    description: "General fleet discussion"
    members: ["obi-wan", "rupert", "scotty", "k2so", "geppetto", "moneypenny"]
  - name: "alerts"
    description: "System alerts and notifications"
    members: ["obi-wan", "rupert", "scotty", "k2so", "geppetto", "moneypenny"]
  - name: "handoffs"
    description: "Task handoffs between agents"
    members: ["obi-wan", "rupert", "scotty", "k2so", "geppetto", "moneypenny"]
  - name: "engineering"
    description: "Engineering team channel"
    members: ["scotty", "k2so", "geppetto", "obi-wan"]
  - name: "business"
    description: "Business & commercial discussion"
    members: ["rupert", "obi-wan", "moneypenny"]
  - name: "deployments"
    description: "Deployment status and coordination"
    members: ["scotty", "k2so", "geppetto", "obi-wan"]

# Task routing rules
task_routing:
  # Route by capability match
  strategy: "capability_based"
  # Fallback roles
  fallback_roles:
    orchestration: "obi-wan"
    engineering: "scotty"
    business: "rupert"
    operations: "moneypenny"

# Kanban board configuration
kanban_board:
  name: "afaaS-fleet"
  columns:
    - id: "backlog"
      name: "Backlog"
      wip_limit: null
    - id: "ready"
      name: "Ready"
      wip_limit: 10
    - id: "in_progress"
      name: "In Progress"
      wip_limit: 6
    - id: "review"
      name: "Review"
      wip_limit: 4
    - id: "done"
      name: "Done"
      wip_limit: null
  # Default tags for categorization
  default_tags:
    - "mcp"
    - "dashboard"
    - "fleet"
    - "infrastructure"
    - "client"
    - "internal"
    - "bug"
    - "feature"
    - "tech-debt"

# Dispatcher configuration (gateway-embedded)
dispatcher:
  enabled: true
  # Auto-assign based on role match
  auto_assign: true
  # Max concurrent tasks per agent
  max_concurrent_per_agent: 2
  # Heartbeat interval (seconds)
  heartbeat_interval: 30
  # Stale threshold (seconds)
  stale_threshold: 120

# Model switching configuration
model_switching:
  # Current orchestration model
  orchestration_model: "qwen3:14b"
  # Coding model for Scotty/K-2SO/Geppetto
  coding_model: "qwen2.5-coder:14b"
  # Switch command (via hermes config)
  switch_command: "hermes config set model.default"