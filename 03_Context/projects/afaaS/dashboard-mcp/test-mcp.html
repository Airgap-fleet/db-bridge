<!DOCTYPE html>
<html>
<head>
    <title>Dashboard MCP Test</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1e1e1e; color: #d4d4d4; }
        button { padding: 10px 20px; margin: 5px; background: #0e639c; color: white; border: none; cursor: pointer; }
        button:hover { background: #1177bb; }
        pre { background: #2d2d2d; padding: 15px; overflow: auto; max-height: 400px; }
        .success { color: #4ec9b0; }
        .error { color: #f44747; }
        input { padding: 8px; width: 300px; background: #3c3c3c; border: 1px solid #555; color: white; }
    </style>
</head>
<body>
    <h1>Dashboard MCP Test (FastMCP 3.4.6)</h1>
    <p>Server: <span id="serverUrl">http://localhost:8001/mcp</span></p>
    
    <div>
        <button onclick="testHealth()">GET /health</button>
        <button onclick="testToolsList()">POST tools/list</button>
        <button onclick="testFleetStatus()">POST fleet_status</button>
        <button onclick="testAgentHealth()">POST agent_health</button>
    </div>
    
    <h3>Custom Tool Call</h3>
    <input type="text" id="toolName" placeholder="Tool name (e.g., fleet_status, agent_health)" value="fleet_status">
    <button onclick="testTool()">Call Tool</button>
    
    <h3>Response</h3>
    <pre id="output"></pre>

    <script>
        const BASE = 'http://localhost:8001/mcp';
        const out = document.getElementById('output');
        
        function log(msg, isError = false) {
            out.textContent += msg + '\n';
            out.scrollTop = out.scrollHeight;
        }
        
        async function callTool(name, args = {}) {
            log(`→ tools/call "${name}"`, false);
            try {
                const res = await fetch(BASE, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'MCP-Protocol-Version': '2025-11-25',
                        'Accept': 'application/json, text/event-stream',
                        'Mcp-Method': 'tools/call',
                        'Mcp-Name': name
                    },
                    body: JSON.stringify({
                        jsonrpc: '2.0',
                        id: Date.now(),
                        method: 'tools/call',
                        params: { name, arguments: args }
                    })
                });
                
                // Parse SSE response
                const text = await res.text();
                for (const line of text.split('\n')) {
                    if (line.startsWith('data: ')) {
                        const data = JSON.parse(line.slice(6));
                        log(`← ${res.status} ${JSON.stringify(data, null, 2)}`, !res.ok);
                        alert(`Response received! Check output below.`);  // ADD THIS
                        return;
                    }
                }
                log(`← ${res.status} ${text}`, !res.ok);
            } catch (e) {
                log(`← ERROR: ${e.message}`, true);
            }
        }
        
        function testHealth() {
            out.textContent = '';
            fetch('http://localhost:8001/health')
                .then(r => r.json())
                .then(d => log(`← 200 ${JSON.stringify(d, null, 2)}`))
                .catch(e => log(`← ERROR: ${e.message}`, true));
        }
        
        function testToolsList() { callTool('list_tools', {}); }
        function testFleetStatus() { callTool('fleet_status'); }
        function testAgentHealth() { callTool('agent_health', { agent_id: 'test-agent' }); }
        function testTool() { callTool(document.getElementById('toolName').value); }
    </script>
</body>
</html>
