[project]
name = "obsidian-mcp"
version = "0.1.0"
description = "MCP Server for Obsidian Vault — read, write, search, and navigate notes"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=0.2.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "aiofiles>=23.0",
    "watchfiles>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "mypy>=1.8",
    "pre-commit>=3.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "UP", "W", "C4", "ANN", "D", "T20", "PYI", "PT", "Q", "SIM", "TID", "TRY", "PD", "RSE", "RET", "ERA", "ISC", "ICN", "PIE", "TCH", "INT", "ARG", "PTH", "PL", "NPY", "PERF", "FBT", "B", "C90"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project.scripts]
obsidian-mcp = "obsidian_mcp.server:main"